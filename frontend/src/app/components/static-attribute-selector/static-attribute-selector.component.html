<div class="selector-container">
    <div *ngIf="loading" class="loading-indicator">
        <mat-spinner diameter="24"></mat-spinner>
        <span>Loading static attributes...</span>
    </div>

    <div *ngIf="error" class="error-message">
        <p>{{ error }}</p>
        <button (click)="loadClasses()">Try again</button>
    </div>

    <mat-form-field *ngIf="!loading && !error" appearance="outline" class="full-width">
        <mat-label>{{ labelText }}</mat-label>
        <mat-select [formControl]="attributeControl">
            <mat-option value="">Select Static Attribute</mat-option>
            <mat-option *ngFor="let attribute of attributeOptions" [value]="attribute.id">
                {{ attribute.displayText }}
            </mat-option>
        </mat-select>
    </mat-form-field>
</div>
