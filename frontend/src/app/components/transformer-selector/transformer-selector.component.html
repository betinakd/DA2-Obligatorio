<div class="selector-container">
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ labelText }}</mat-label>
        <mat-select [formControl]="transformerControl">
            <mat-option *ngFor="let transformer of transformers" [value]="transformer">
                {{ transformer }}
            </mat-option>
        </mat-select>
    </mat-form-field>
    </div>
