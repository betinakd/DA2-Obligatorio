<div class="selector-container">
    <div *ngIf="loading" class="loading-indicator">
      <mat-spinner diameter="24"></mat-spinner>
      <span>Charging classes...</span>
    </div>
    
    <div *ngIf="error" class="error-message">
      <p>{{ error }}</p>
      <button (click)="loadClasses()">Try again</button>
    </div>
    
    <mat-form-field *ngIf="!loading && !error" appearance="outline" class="full-width">
      <mat-label>{{ labelText }}</mat-label>
      <mat-select [formControl]="classControl">
        <mat-option value="">Select Class</mat-option>
        <mat-option *ngFor="let class of classes" [value]="class.id">
          {{ class.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
