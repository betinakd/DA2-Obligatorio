<ng-container *ngIf="namespace || error">

  <mat-card *ngIf="isError" class="error-card">
    <mat-card-header>
      <mat-icon mat-card-avatar color="warn">error</mat-icon>
      <mat-card-title>Error</mat-card-title>
      <mat-card-subtitle *ngIf="error?.innerCode !== undefined">
        Código: {{ error?.innerCode }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="error-message">{{ error?.message || 'Ocurrió un error desconocido' }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="namespace" class="namespace-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>folder</mat-icon>
      <mat-card-title>{{ namespace.name }}</mat-card-title>
      <mat-card-subtitle>ID: {{ namespace.id }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content *ngIf="hasParentNamespace">
      <p class="parent-namespace">
        <strong>Namespace padre:</strong> {{ namespace.baseNamespaceId }}
      </p>
    </mat-card-content>
  </mat-card>
</ng-container>
