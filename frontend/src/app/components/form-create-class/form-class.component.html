<div class="form-container">
    <h2>Create New Class</h2>
    
    <form [formGroup]="classForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Class Name</mat-label>
        <input matInput formControlName="name" placeholder="MyClass">
        <mat-error *ngIf="classForm.get('name')?.hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Class Type</mat-label>
        <mat-select formControlName="state">
          <mat-option value="Normal">Normal</mat-option>
          <mat-option value="Abstract">Abstract</mat-option>
          <mat-option value="Sealed">Sealed</mat-option>
          <mat-option value="Interface">Interface</mat-option>
        </mat-select>
        <mat-error *ngIf="classForm.get('state')?.hasError('required')">
          Class type is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Base Class</mat-label>
        <mat-select formControlName="idBaseClass">
          <mat-option value="11111111-1111-1111-1111-111111111111">None</mat-option>
          <mat-option *ngFor="let class of availableClasses" [value]="class.id">
            {{ class.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Namespace</mat-label>
        <mat-select formControlName="idBaseNamespace" required>
          <mat-option *ngFor="let namespace of availableNamespaces" [value]="namespace.id">
            {{ namespace.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="classForm.get('idBaseNamespace')?.hasError('required')">
          Namespace is required
        </mat-error>
      </mat-form-field>
      
      <div class="form-actions">
        <button mat-button type="button" (click)="resetForm()">Reset</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="classForm.invalid">
          Create Class
        </button>
      </div>
    </form>
  </div>
