<div class="selector-container">
  <div *ngIf="loading" class="loading-indicator">
    <mat-spinner diameter="24"></mat-spinner>
    <span>Charging methods...</span>
  </div>
  
  <div *ngIf="error" class="error-message">
    <p>{{ error }}</p>
    <button (click)="loadMethods()">Try again</button>
  </div>
  
  <mat-form-field *ngIf="!loading && !error && methods.length > 0" appearance="outline" class="full-width">
    <mat-label>{{ labelText }}</mat-label>
    <mat-select [formControl]="methodControl">
      <mat-option value="">Select Method</mat-option>
      <mat-option *ngFor="let method of methods" [value]="method.id">
        {{ method.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  
  <div *ngIf="!loading && !error && methods.length === 0" class="no-methods-message">
    No methods available for this class
  </div>
</div>
