<div class="selector-container">
    <div *ngIf="loading" class="loading-indicator">
      <mat-spinner diameter="24"></mat-spinner>
      <span>Charging namespaces...</span>
    </div>
    
    <div *ngIf="error" class="error-message">
      <p>{{ error }}</p>
      <button (click)="loadNamespaces()">Try again</button>
    </div>
    
    <mat-form-field *ngIf="!loading && !error" appearance="outline" floatLabel="always" class="full-width">
      <mat-label>{{ labelText }}</mat-label>
      <mat-select [formControl]="namespaceControl" placeholder=" ">
        <mat-option value="">Select Namespace</mat-option>
        <mat-option *ngFor="let namespace of namespaces" [value]="namespace.id">
          {{ namespace.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
