<div class="selector-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ labelText }}</mat-label>
      <mat-select [formControl]="typeControl">
        <mat-option *ngFor="let type of classTypes" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
