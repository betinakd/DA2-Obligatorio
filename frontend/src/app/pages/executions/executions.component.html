<label for="invocationName">Method Name:</label>
<input type="text" id="invocationName" [(ngModel)]="executionRequest.methodName" placeholder="Invocation Name" />

<app-class-selector [labelText]="'Select Method Return Type'" (classSelected)="onReturnTypeChange($event)">
</app-class-selector>

<app-parameter-signature-list [parameters]="executionRequest.parameters"
    (parametersChange)="onParametersChange($event)">
</app-parameter-signature-list>

<app-class-selector [labelText]="'Select Reference Type'"
    (classSelected)="onTypeReferenceSelected($event)"></app-class-selector>

<app-class-selector [labelText]="'Select Instance Type'"
    (classSelected)="onTypeInstanceSelected($event)"></app-class-selector>

<button (click)="onCreateExecution()">Create Execution</button>

<div *ngIf="loading" class="execution-status loading">
    <p>Procesando solicitud...</p>
</div>

<div *ngIf="error" class="execution-status error">
    <h5>Error:</h5>
    <p>{{ error }}</p>
</div>

<div *ngIf="success" class="execution-result">
    <h5>Execution created succesfully:</h5>
    <pre class="execution-trace">{{ success }}</pre>
    </div>
