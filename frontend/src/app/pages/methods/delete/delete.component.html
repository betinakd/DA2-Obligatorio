<div class="page-container">
    <h1>Delete Method</h1>

    <app-method-selector (methodSelected)="onMethodSelected($event)" [reload]="loading">
    </app-method-selector>

    <div class="delete-button-container">
        <button class="btn-delete" (click)="deleteMethod()">
            <span class="material-icons">delete_forever</span> Delete Method
        </button>
    </div>

    <div *ngIf="success" class="alert alert-success"
        style="margin-top: 15px; padding: 10px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px;">
        {{success}}
    </div>

    <div *ngIf="error" class="alert alert-danger"
        style="margin-top: 15px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;">
        {{error}}
    </div>
</div>
