<div class="page-container">
  <h1>Create Method</h1>


  <app-class-selector [labelText]="'Select Class of method*'" (classSelected)="onClassChange($event)"
    [reload]="loading"></app-class-selector>

  <app-method-create (methodChange)="onMethodChange($event)">
  </app-method-create>

  <div class="create-button-container">
    <button class="btn-create" (click)="createMethod()">
      <span class="material-icons">functions</span> Create Method
    </button>
  </div>

  <div *ngIf="success" class="alert alert-success"
    style="margin-top: 15px; padding: 10px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px;">
    {{success}}
  </div>

  <div *ngIf="error" class="alert alert-danger"
    style="margin-top: 15px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;">
    {{error}}
  </div>
</div>
