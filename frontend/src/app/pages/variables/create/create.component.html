<div class="container">
  <!-- Formulario para crear una nueva variable -->
  <div>
    <h2>Create new Variable</h2>
    
    <div *ngIf="isLoading" class="loading">
      Cargando...
    </div>
    
    <div *ngIf="error" class="error">
      {{ error }}
    </div>
    
    <div *ngIf="successMessage" class="success">
      {{ successMessage }}
    </div>
    
    <!-- Reemplaza el formulario actual con este -->
    <form #variableForm="ngForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
      <div class="form-group">
        <label for="name">Name:</label>
        <input 
          type="text" 
          id="name" 
          name="name"
          [(ngModel)]="varName" 
          #nameInput="ngModel"
          required 
          pattern="^[a-zA-Z][a-zA-Z0-9_]*$"
          class="form-control">
      </div>
      
      <div class="form-field-container">
        <app-class-selector
          (classSelected)="onClassSelectedReference($event)"
          [labelText]="'Select Reference Class'">
        </app-class-selector>
      </div>
      
      <div class="form-field-container">
        <app-class-selector
          (classSelected)="onClassSelectedInstance($event)"
          [labelText]="'Select Instance Class'">
        </app-class-selector>
      </div>

      <div class="form-group">
        <label for="methodId">ID del Método (GUID):</label>
        <input 
          type="text" 
          id="methodId" 
          name="methodId"
          [(ngModel)]="methodId" 
          #methodIdInput="ngModel"
          required 
          class="form-control">
      </div>
      
      <button type="submit" [disabled]="variableForm.invalid || isLoading" class="btn btn-primary">
        Create Variable
      </button>
    </form>
  </div>
</div>
