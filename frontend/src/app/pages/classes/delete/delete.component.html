<h1>Delete Class</h1>

<app-class-selector 
  [labelText]="'Select Class to Delete*'" 
  (classSelected)="onClassSelected($event)" 
  [reload]="reload">
</app-class-selector>

<div class="delete-button-container">
  <button class="btn-delete" (click)="deleteClassClick()">
    <span class="material-icons">delete_forever</span> Delete Class
  </button>
</div>

<div *ngIf="successMessage">
  <p>{{ successMessage }}</p>
</div>

<div *ngIf="error">
  <p>{{ error }}</p>
</div>
