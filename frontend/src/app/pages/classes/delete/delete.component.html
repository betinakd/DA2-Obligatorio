<h1>Delete Class</h1>

<app-class-selector [labelText]="'Select Class to Delete*'" (classSelected)="onClassSelected($event)" [reload]="reload">
</app-class-selector>

<div class="delete-button-container">
  <button class="btn-delete" (click)="deleteClassClick()">
    <span class="material-icons">delete_forever</span> Delete Class
  </button>
</div>

<div class="messages">
  <div *ngIf="successMessage" class="success-message">
    <i class="material-icons">check_circle</i>
    <span>{{ successMessage }}</span>
  </div>

  <div *ngIf="error" class="error-message">
    <i class="material-icons">error</i>
    <span>{{ error }}</span>
  </div>
</div>
