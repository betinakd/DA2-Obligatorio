<h1>Update Class</h1>
<div class="page-container">
  <label>Class name:</label>
  <input #classNameInput [(ngModel)]="name" placeholder="Class Name" class="form-control" required>

  <app-class-selector [labelText]="'Select Class to Update'" (classSelected)="onClassSelected($event)"
    [reload]="loading">
  </app-class-selector>

  <app-class-selector [labelText]="'Select Base Class'" (classSelected)="onBaseClassSelected($event)"
    [reload]="loading">
  </app-class-selector>

  <app-namespace-selector [labelText]="'Select Namespace'" (namespaceSelected)="onNamespaceSelected($event)"
    [reload]="loading"></app-namespace-selector>

  <app-accesibility-selector [labelText]="'Select State'"
    (typeSelected)="onStateSelected($event)"></app-accesibility-selector>

  <app-attribute-list (attributesChange)="onAttributesUpdated($event)"></app-attribute-list>

  <app-implements-list (implementsChanged)="onInterfacesUpdated($event)"></app-implements-list>

  <app-method-list (methodsChange)="onMethodsUpdated($event)"></app-method-list>

  <div *ngIf="success" class="alert alert-success"
    style="margin-top: 15px; padding: 10px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px;">
    {{success}}
  </div>

  <div *ngIf="error" class="alert alert-danger"
    style="margin-top: 15px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px;">
    {{error}}
  </div>

  <div class="update-button-container">
    <button class="btn-update" (click)="updateClass()">
      <span class="material-icons">save</span> Update Class
    </button>
  </div>
</div>
