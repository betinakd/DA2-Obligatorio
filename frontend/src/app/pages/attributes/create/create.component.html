<div class="container">
  <h2>Create Attribute</h2>

  <div class="form-container">
    <div class="class-selector-container">
      <app-class-selector [labelText]="'Class'" (classSelected)="onClassSelected($event)">
      </app-class-selector>
    </div>

    <div class="attribute-container">
      <app-attribute-item [attribute]="myAttribute" [relatedClassId]="myAttribute.idRelatedClass"
        (attributeChange)="onAttributeChanged($event)">
      </app-attribute-item>
    </div>

    <div class="actions">
      <button class="create-btn" (click)="clickCreate()">Create Attribute</button>
    </div>
  </div>
</div>

<div class="messages">
  <div *ngIf="success" class="success-message">
    <i class="material-icons">check_circle</i>
    <span>{{ success }}</span>
  </div>

  <div *ngIf="error" class="error-message">
    <i class="material-icons">error</i>
    <span>{{ error }}</span>
  </div>
</div>
